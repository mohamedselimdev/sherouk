name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: shrouk
          POSTGRES_PASSWORD: shrouk_local_only
          POSTGRES_DB: shrouk_test
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U shrouk"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://shrouk:shrouk_local_only@127.0.0.1:54329/shrouk_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
